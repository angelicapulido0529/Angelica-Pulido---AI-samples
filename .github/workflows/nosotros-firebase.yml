# Sube a Firebase las reglas de seguridad y el servidor (Cloud Functions)
# de "Nosotros". Se ejecuta a mano: Actions → "Nosotros · Firebase" → Run workflow.
name: Nosotros · Firebase

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "ID del proyecto de Firebase (ej. nosotros-1234)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nosotros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix functions
      - name: Credenciales
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (ver SETUP.md, paso 4)"
            exit 1
          fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Desplegar reglas y funciones
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: >
          npx --yes firebase-tools@latest deploy
          --project "${{ inputs.project_id }}"
          --only firestore,storage,functions
          --force --non-interactive
